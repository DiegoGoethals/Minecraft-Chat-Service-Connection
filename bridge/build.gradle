plugins {
	id 'application'
}

dependencies {
	implementation project(':protocol')
	implementation "org.java-websocket:Java-WebSocket:${java_websocket_version}"
	implementation "org.slf4j:slf4j-api:${slf4j_version}"
	runtimeOnly "org.slf4j:slf4j-simple:${slf4j_version}"

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'dev.tesmp.fluxerbridge.bridge.Main'
	applicationName = 'fluxer-bridge'
}

jar {
	manifest {
		attributes 'Implementation-Title': 'fluxer-bridge', 'Implementation-Version': project.version
	}
}

test {
	// A hung network test should fail the build, not stall it.
	systemProperty 'junit.jupiter.execution.timeout.default', '60s'
}
