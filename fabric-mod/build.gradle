plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'fluxerbridge'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Our shared protocol + bridge client. Gson comes from Minecraft itself,
	// so only the protocol jar is nested inside the mod jar.
	implementation(project(':protocol')) { transitive = false }
	include(project(':protocol'))
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

loom {
	runs {
		// Only a dedicated server makes sense for this mod.
		remove client
	}
}
