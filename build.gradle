// Shared settings for the plain-Java modules (protocol, bridge).
// The Fabric mod configures itself in fabric-mod/build.gradle.
subprojects {
	group = rootProject.group
	version = rootProject.version

	repositories {
		mavenCentral()
	}

	tasks.withType(JavaCompile).configureEach {
		options.release = 25
		options.encoding = 'UTF-8'
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}
}
