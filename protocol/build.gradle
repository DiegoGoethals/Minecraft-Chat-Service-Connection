plugins {
	id 'java-library'
}

// Shared between the Fabric mod and the bridge. Must not depend on Minecraft
// or Fluxer. Gson and SLF4J are provided by Minecraft inside the mod, and
// bundled by the bridge application.
dependencies {
	api "com.google.code.gson:gson:${gson_version}"
	compileOnlyApi "org.slf4j:slf4j-api:${slf4j_version}"

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "org.slf4j:slf4j-api:${slf4j_version}"
	testRuntimeOnly "org.slf4j:slf4j-simple:${slf4j_version}"
}
